name: Deploy blog to EdgeOne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize production uploads so an older deployment cannot finish after a newer one.
concurrency:
  group: edgeone-blog-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLOG_URL: ${{ vars.BLOG_URL }}
      EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || 'my-test' }}
    steps:
      - name: Check out blog source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Prepare cloud build
        run: node .github/scripts/prepare-ci.cjs

      - name: Install blog dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate static website
        run: |
          npm exec -- hexo generate --bail --config _config.yml,_config.ci.yml
          test -s public/index.html

      - name: Deploy to EdgeOne
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "::error::Add the EDGEONE_API_TOKEN repository secret before deploying."
            exit 1
          fi
          npx --yes edgeone@1.6.41 makers deploy ./public \
            --name "$EDGEONE_PROJECT_NAME" \
            --token "$EDGEONE_API_TOKEN" \
            --env production \
            --skip-ai-gateway-sync
