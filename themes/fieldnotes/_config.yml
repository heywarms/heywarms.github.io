# Fieldnotes 主题配置
# 推荐修改博客根目录 _config.fieldnotes.yml；它覆盖此处默认值。
# Hexo Pro → 主题 → Fieldnotes → 配置 → 表单模式，也可直接编辑。
# 数组整体替换；false 表示关闭，[] 表示清空。无需修改文章 Front Matter。

# 品牌名称
brand: Mihotel

# 一句话介绍
tagline: 保持热爱，奔赴山海。

# 导航栏头像：填写图片地址（如 /images/ip/avatar.png）后替代星形标志；留空使用星形标志
brand_avatar: ""

# 主导航：按数组顺序显示，留空 [] 可隐藏全部导航
navigation:
  - title: 首页
    url: /
    new_tab: false
  - title: 专题
    url: /topics/
    new_tab: false
  - title: 文章
    url: /archives/
    new_tab: false
  - title: 作品
    url: /projects/
    new_tab: false
  - title: 生活
    url: /life/
    new_tab: false
  - title: 关于
    url: /about/
    new_tab: false

# 外观：颜色用六位十六进制；内容宽度范围 960–1600
appearance:
  mode: system
  toggle: true
  accent: "#3158df"
  accent_dark: "#9aaeff"
  background: "#f7f6f2"
  background_dark: "#171b19"
  content_width: 1200
  font: sans

# 首页开场文案与按钮
hero:
  primary_text: 读点什么
  primary_url: /topics/
  secondary_text: 认识一下
  secondary_url: /about/
  eyebrow: A LITTLE CORNER OF THE INTERNET
  line_one: 保持好奇，
  line_two: 自在生长。
  introduction: 写下技术里的发现，也收藏生活中的微光。这里有代码、有想法，还有一些不着急的日常。
  annotation: 一半是逻辑，一半是浪漫。

# 3D 储物柜：关闭时显示静态封面，不加载三维引擎
locker:
  enabled: true
  on_about: true
  caption: THE CURIOSITY CABINET
  number: NO. 001
  note: 把想法、日常和一点点自己，好好收在这里。
  poster: /images/locker-preview.png
  poster_alt: 立体个人储物柜
  landscape: /images/fieldnotes-landscape.svg
  body_color: "#e8e3d3"
  articles_color: "#294ddb"
  life_color: "#ecd581"
  about_color: "#d9835c"

# 电影感首页：order 中加入 stage / episode / notes / profile / dispatch 时生效
# accent 是手写签名与重点按钮的颜色；sphere_a / sphere_b 是粒子球与抽象封面的两种颜色
# fonts 是 Anton + Condiment 字体样式表（https），留空则只用系统字体
cinema:
  accent: "#C6FF3D"
  sphere_a: "#6EE7FF"
  sphere_b: "#A78BFA"
  fonts: https://fonts.googleapis.com/css2?family=Anton&family=Condiment&display=swap

# 早期档案：categories 中分类的文章不上首页列表，合并为一行“早期档案”，也是首屏最后一颗星球
archive:
  categories: []
  text: 早期档案：之前写的技术笔记
  name: 早期档案
  description: 之前写的技术笔记，继续保留、可以搜到。
  planet: ice

# 首页模块：order 决定顺序，enabled 决定是否显示；不影响独立页面
# 经典模块：hero / interlude / topics / featured / projects / journal / about
# 电影感模块：stage（开场）/ episode（最新一期）/ notes（文章列表）/ profile（关于我）/ dispatch（订阅与字标）
# 玻璃卡片模块：routes（学习路线）/ glossary（大白话词典）/ videos（视频 × 笔记）/ updates（最近更新）/ connect（关于我与订阅）
home:
  order:
    - hero
    - interlude
    - topics
    - featured
    - projects
    - journal
    - about
  hero:
    enabled: true
  interlude:
    enabled: true
    items:
      - 写代码
      - 记灵感
      - 去生活
    note: Good things take curiosity.
  topics:
    enabled: true
    eyebrow: THE NOTEBOOK SHELF
    title: 挑一格，慢慢探索
    link_text: 专题书架
  featured:
    enabled: true
    eyebrow: SELECTED NOTES
    title: 值得慢慢读的几篇
    link_text: 全部文章
    limit: 3
  projects:
    enabled: true
    eyebrow: ON MY WORKBENCH
    title: 不只记录，也动手创造
    link_text: 我的作品
  journal:
    enabled: true
    eyebrow: THE JOURNAL
    title: 最近，写了这些
    limit: 5
    show_life: true
  about:
    enabled: true
    eyebrow: ALWAYS EXPLORING
    title: 一个持续更新中的人。
    description: 在这里，想法可以不完整，热爱可以很具体。
    link_text: 更多关于我
  # 开场：visual 为 planets（星际旅行：星图上每条学习路线和早期档案各是一个星系，跃迁后抵达它的 3D 星球）、sphere（3D 粒子球，chips 是周围漂浮的标签）或 video（全屏背景视频）
  # heading 每项一行；视频放在博客 source/ 下，填 /videos/xxx.mp4；mobile_* 为手机竖版，可留空
  stage:
    enabled: true
    visual: sphere
    eyebrow: Plain-words AI · Videos & Notes
    heading:
      - Hello!
      - I'm Mihotel
    signature: Mihotel
    tagline: ""
    note: ""
    primary_text: 看最新一期
    primary_url: "#videos"
    secondary_text: 读笔记
    secondary_url: /archives/
    chips: []
    video: ""
    video_webm: ""
    poster: ""
    mobile_video: ""
    mobile_video_webm: ""
    mobile_poster: ""
  # 最新一期：post 填 _posts/文件名.md 或文章标题；video_url 填 B站等视频地址；cards 最多 3 张小卡片
  episode:
    enabled: true
    heading:
      - Latest
      - Episode
    signature: new!
    intro: ""
    intro_zh: ""
    label: ""
    post: ""
    cover_title: ""
    video_title: ""
    meta: ""
    duration: ""
    video_url: ""
    watch_text: 看视频
    read_text: 读笔记
    video: ""
    video_webm: ""
    poster: ""
    cards: []
  # 文章列表：exclude_categories 中的分类不上首页，并合并为一行“早期档案”；upcoming 为预告条目
  notes:
    enabled: true
    heading:
      - Notes
    signature: plain words
    link_text: All notes
    limit: 4
    exclude_categories: []
    archive_text: 早期档案：之前写的技术笔记
    upcoming: []
  # 关于我：description 留空时使用 about.description；facts 为“标签 / 内容”列表；stickers 为贴纸文字
  profile:
    enabled: true
    eyebrow: About · 关于我
    heading:
      - The guy in
      - the blue hoodie
    signature: that's me
    description: ""
    note: ""
    facts: []
    stickers: []
    link_text: 更多关于我
    link_url: /about/
    video: ""
    video_webm: ""
    poster: ""
  # 订阅与字标：form_action 填邮件订阅服务的 https 表单地址后才显示邮箱输入框；wordmark 留空使用品牌名称
  dispatch:
    enabled: true
    eyebrow: Weekly dispatch
    title: ""
    description: ""
    form_action: ""
    email_field: email
    placeholder: 输入邮箱
    button_label: 订阅
    video: ""
    video_webm: ""
    poster: ""
    video_caption: ""
    wordmark: ""
    signature: see you next week!
  # 学习路线：items 最多 3 条；topic 填专题 slug，planned 是规划中的选题；region 是星球短名
  # planet 可选 ocean / gas / desert / ice / lava，不填时按顺序使用前三种
  routes:
    enabled: true
    eyebrow: Start here
    title: 从这里开始
    description: ""
    link_text: ""
    link_url: ""
    items: []
  # 大白话词典：items 每项 term / en / definition / url
  glossary:
    enabled: true
    eyebrow: Plain words
    title: 听到这些词，别慌
    description: ""
    link_text: ""
    link_url: ""
    items: []
  # 视频 × 笔记：post 为配套文章；poster 留空时显示抽象光效封面；extras 为“这一期的配套”，more 为往期小卡片
  videos:
    enabled: true
    eyebrow: Video × Notes
    title: 每期视频，都有一份能回看的笔记
    description: ""
    link_text: ""
    link_url: ""
    post: ""
    label: ""
    cover_title: ""
    video_title: ""
    meta: ""
    duration: ""
    video_url: ""
    watch_text: 在 B站观看
    poster: ""
    extras: []
    more: []
  # 最近更新：按时间列出文章，早期档案分类合并成一行；upcoming 为预告
  updates:
    enabled: true
    eyebrow: Latest
    title: 最近更新
    link_text: 全部文章
    limit: 5
    upcoming: []
  # 关于我与订阅：video / poster 可放 IP 动画；form_action 填邮件订阅服务的 https 表单地址后才出现邮箱输入框
  connect:
    enabled: true
    eyebrow: About
    title: ""
    description: ""
    note: ""
    link_text: 更多关于我
    link_url: /about/
    show_project: true
    video: ""
