    subscribe_title: ""
    subscribe_description: ""
    form_action: ""
    email_field: email
    placeholder: 输入邮箱
    button_label: 订阅

# 全站功能开关
features:
  search: true
  code_copy: true
  image_zoom: true

# 文章列表（归档、分类、标签、首页第 2 页起）的开场背景：一段缓慢循环的视频铺满首屏，
# 标题居中压在画面最亮处，往下滚逐渐变暗、交回页面背景。poster 是首帧图，视频出来前先显示它。
# hue 把视频整体偏色（-180–180 度），让素材的颜色靠近站点配色；没有 video 时只显示 poster
list_backdrop:
  enabled: false
  video: ""
  poster: ""
  hue: 0

# 专题页开场：每个专题是一颗代码绘制的星球（海洋、气态巨行星带光环、沙漠、冰、熔岩），
# 当前专题铺满下方天空，另外两颗半露在左右边缘，点一下互换。最多取前 3 个专题。
# 专题可写 planet: ocean / gas / desert / ice / lava；不写时按 artwork 选，再不行取没用过的类型
topic_hero:
  enabled: false

# 精选文章：title 或 source 精确匹配，草稿不会公开
featured:
  - title: Docker快速入门
    label: BUILD & EXPLORE
    description: 从一个容器开始，把环境、镜像与常用命令串起来。
    artwork: containers
  - title: MySQL 锁
    label: UNDER THE HOOD
    description: 全局锁、表锁与行锁，理解并发背后的秩序。
    artwork: database
  - title: 什么是大模型
    label: STAY CURIOUS
    description: 关于大模型的第一份笔记，从概念到可能性。
    artwork: intelligence

# 专题书架：sources 决定阅读顺序，categories 自动收录同分类文章
topics:
  - slug: docker
    title: Docker 实践手记
    label: BUILD & RUN
    description: 从跑起第一个容器，到处理通信、权限与远程访问。沿着实际问题，慢慢搭好自己的工具箱。
    note: 适合想把 Docker 真正用起来的人。
    artwork: containers
    categories:
      - docker
    sources:
      - _posts/Docker快速入门.md
      - _posts/docker宿主机与容器传递文件-cp-命令.md
      - _posts/多容器通信.md
      - _posts/docker-run-bin-bash和-usr-sbin-init区别.md
      - _posts/docker-privileged.md
      - _posts/容器配置ssh远程登录.md
  - slug: mysql
    title: MySQL 深入一层
    label: UNDER THE HOOD
    description: 从索引走向事务、锁和日志。不只记住怎么用，也试着理解数据库为什么这样工作。
    note: 适合写过 SQL，想继续往下探索的人。
    artwork: database
    categories:
      - MySql
    sources:
      - _posts/MySql-索引.md
      - _posts/MySQL设置事务自动提交（开启和关闭）.md
      - _posts/MySQL-锁.md
      - _posts/MySql死锁问题.md
      - _posts/MySql-binlog-debus.md
  - slug: ai
    title: 从大模型开始
    label: STAY CURIOUS
    description: 留一格给新的好奇。从认识大模型开始，记录对 AI 的理解与接下来的探索。
    note: 从概念入门，先建立一张地图。
    artwork: intelligence
    categories:
      - 大模型
    sources:
      - _posts/什么是大模型.md

# 个人作品：图片可用 /images/ 下的文件
projects:
  - slug: hexo-pro
    title: Hexo Pro
    label: A TOOL I AM BUILDING
    tagline: 把写博客这件事，变得顺手一点。
    description: 从管理自己的 Hexo 博客开始，把编辑、预览、桌面管理和手机写作放进同一个工具里。这个站点，也是它的使用现场。
    status: 持续打磨中
    image: /images/hexo-pro-editor.png
    image_alt: Hexo Pro 的文章管理与编辑界面
    stack:
      - Hexo
      - React
      - Electron
      - Capacitor
    source_url: https://github.com/wuzheng228/hexo-pro-client
    features:
      - title: 写作与预览
        description: 块编辑、Markdown 源码与当前主题预览，缩短从想法到文章的距离。
      - title: 桌面与手机
        description: 在电脑上整理博客，也能用 iPhone App 继续记录，不必一直守着电脑。
      - title: 同步与发布
        description: 通过 GitHub 同步源文件，再由 GitHub Actions 将博客部署到 EdgeOne。

