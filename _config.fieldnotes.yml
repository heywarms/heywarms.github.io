  # 学习路线：每条路线也是首屏的一颗星球。topic 填专题的 slug（见下面 topics），planned 是还没写的选题
  # planet 可选 ocean（海洋）/ gas（气态巨行星，带光环）/ desert（暖阳星球：草原、秋林、河流，夜面城镇灯光，带空间站）/ ice（冰封，带小行星带）/ lava（熔岩）
  routes:
    enabled: true
    eyebrow: Season 01 · AI 大白话
    title: 懂一点原理，用得更好
    description: 第一季分三站：认识它、会问它、让它帮你做事。按顺序看就行，不需要任何技术基础。
    link_text: 全部专题
    link_url: /topics/
    # 每发布一篇，就把它从 planned 里删掉，避免“已发布”和“规划中”重复计数
    items:
      - step: 第一站 · 认识它
        title: AI 到底是什么
        description: 不讲公式。用生活里的比方讲清它是怎么「学会说话」的，以及这对你怎么用它意味着什么。
        tag: 零基础
        topic: ai-basics
        region: 认识 AI
        planet: ocean
        planned:
          - 发刊词：为什么要懂一点原理
          - 你其实早就在用 AI 了
          - 豆包、DeepSeek、ChatGPT 是什么关系
          - 大模型是怎么学会说话的
          - 为什么它会一本正经地胡说八道
          - AI 的记性有多好
          - AI 知道今天的新闻吗
          - 智能体：从“告诉你”到“替你做”
      - step: 第二站 · 会问它
        title: 怎么跟 AI 说话
        description: 它不认识你，只看得到你这次说的话。学会交代背景、给例子、让它反问你，回答就会准得多。
        tag: 规划中
        topic: ai-talk
        region: 跟 AI 说话
        planet: gas
        planned:
          - 为什么问得越具体，答得越好
          - 给它看一个例子
          - 不知道怎么问，就让它先问你
          - 第一版不满意，怎么让它改
          - 拍照问、说话问
      - step: 第三站 · 让它帮你做事
        title: 用 AI 写、读、理、画
        description: 用不同职业的真实例子：写文案和回复、读长文和合同、整理表格和计划，再讲清哪些事别交给它。
        tag: 规划中
        topic: ai-work
        region: 用 AI 做事
        planet: desert
        planned:
          - 帮你写：文案、通知、回复
          - 帮你读：长文章、合同、说明书
          - 帮你理：表格、笔记、计划
          - 画图和做视频是怎么回事
          - 哪些事别交给 AI
          - 怎么挑适合自己的 AI 工具
  # 大白话词典：term 词语、en 英文名、definition 解释、url 详细笔记（可选）
  glossary:
    enabled: true
    eyebrow: Plain words
    title: 听到这些词，别慌
    description: AI 圈的「黑话」，翻译成人话。
    link_text: ""
    link_url: ""
    items:
      - term: 大模型
        en: LLM
        definition: 读过海量文字、学会了「接着往下写」的程序。你提一个问题，它按学到的规律，一个词一个词地写出最可能的回答。
        url: ""
      - term: 提示词
        en: Prompt
        definition: 你对 AI 说的话。交代清楚你是谁、要它做什么、想要什么样的结果，它就答得更准。
        url: ""
      - term: 幻觉
        en: Hallucination
        definition: AI 一本正经地编出不存在的内容，比如一篇根本没有的论文。重要的信息，一定要自己再核对一遍。
        url: ""
      - term: 上下文
        en: Context
        definition: AI 在这次对话里「记得」的内容。聊得太长或者换了新对话，它可能就忘了前面说过的话。
        url: ""
  # 视频 × 笔记：post 填配套文章；视频发布后填 video_title / meta / duration / video_url，poster 可填 B站封面
